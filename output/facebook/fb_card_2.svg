<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>MPA News 2/3</title>
<defs><style>
    /* brand settings: edit colors and font here */
    /* font: Noto Sans Myanmar | ink/dark: #14213D | accent: #C8102E | muted: #6B7280 */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800');
    text { font-family: 'Noto Sans Myanmar','Pyidaungsu','Myanmar Text','Padauk','Inter',Arial,sans-serif; }
    .paper { fill: #FFFFFF; }
    .dark { fill: #14213D; }
    .accent { fill: #C8102E; }
    .chiptxt { fill: #fff; font-size: 34px; font-weight: 700; }
    .head { fill: #14213D; font-size: 58px; font-weight: 700; }
    .headw { fill: #FFFFFF; font-size: 56px; font-weight: 700; }
    .kicker { fill: #C8102E; font-size: 30px; font-weight: 700; letter-spacing: 2px; font-family: 'Inter',Arial,sans-serif; }
    .kickerw { fill: #FF8A9B; font-size: 30px; font-weight: 700; letter-spacing: 2px; font-family: 'Inter',Arial,sans-serif; }
    .head1 { fill: #14213D; font-size: 52px; font-weight: 700; }
    .head3 { fill: #14213D; font-size: 50px; font-weight: 700; }
    .big { fill: #C8102E; font-size: 140px; font-weight: 800; font-family: 'Inter',Arial,sans-serif; }
    .bigsub { fill: #FFFFFF; font-size: 28px; font-weight: 700; letter-spacing: 4px; font-family: 'Inter',Arial,sans-serif; }
    .item { fill: #14213D; font-size: 36px; }
    .itemw { fill: #F4F6FA; font-size: 46px; }
    .num { fill: #C8102E; }
    .numtxt { fill: #fff; font-size: 34px; font-weight: 700; font-family: 'Inter',Arial,sans-serif; }
    .meta { fill: #6B7280; font-size: 30px; }
    .metaw { fill: #AEB8CC; font-size: 30px; }
    .rule { stroke: #E5E7EB; stroke-width: 2; }
    .rulew { stroke: #34436A; stroke-width: 2; }
    .page { fill: #6B7280; font-size: 28px; font-family: 'Inter',Arial,sans-serif; }
    .pagew { fill: #AEB8CC; font-size: 28px; font-family: 'Inter',Arial,sans-serif; }
</style></defs>
<rect class="dark" width="1080" height="1350"/>
<rect class="accent" x="72" y="96" width="90" height="10" rx="5"/>
<text class="kickerw" x="72" y="170">FREE HER CAMPAIGN</text>
<text class="headw" x="72" y="270.0">FREE HER လှုပ်ရှားမှု၏ အဓိက</text>
<text class="headw" x="72" y="358.0">တောင်းဆိုချက် ၃ ရပ်</text>
<circle class="num" cx="108" cy="464" r="36"/>
<text class="numtxt" x="108" y="476" text-anchor="middle">1</text>
<text class="itemw" x="182" y="478.0">ဒေါ်အောင်ဆန်းစုကြည်အား မိသားစုနှင့်</text>
<text class="itemw" x="182" y="554.0">ချက်ချင်းနှင့် ပုံမှန် တွေ့ဆုံ</text>
<text class="itemw" x="182" y="630.0">ဆက်သွယ်ခွင့်ပေးရန်</text>
<circle class="num" cx="108" cy="746" r="36"/>
<text class="numtxt" x="108" y="758" text-anchor="middle">2</text>
<text class="itemw" x="182" y="760.0">ဒေါ်အောင်ဆန်းစုကြည်အား ခြွင်းချက်မရှိ</text>
<text class="itemw" x="182" y="836.0">ချက်ချင်း လွှတ်ပေးရန်</text>
<circle class="num" cx="108" cy="952" r="36"/>
<text class="numtxt" x="108" y="964" text-anchor="middle">3</text>
<text class="itemw" x="182" y="966.0">နိုင်ငံရေးအကျဉ်းသားအားလုံး လွှတ်ပေးရန်</text>
<text class="metaw" x="72" y="1200">FREE HER Campaign Team ထုတ်ပြန်ချက်</text>
<line class="rulew" x1="72" y1="1232" x2="1008" y2="1232"/>
<image href="https://mpanews.info/wp-content/uploads/2025/07/cropped-logo.png" x="72" y="1254" width="230" height="64" preserveAspectRatio="xMinYMid meet"/>
<text class="metaw" x="1008" y="1296" text-anchor="end">mpanews.info</text>
<text class="pagew" x="1008" y="1332" text-anchor="end">2/3</text>
</svg>
